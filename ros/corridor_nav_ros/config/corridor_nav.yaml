# corridor_nav_node parameters (loaded into the node's private namespace by launch/corridor_nav.launch).
# The navigator's tunables are NOT here: single source of truth = the repository's config/corridor_nav.cfg
# (config/core is a symlink to the repository's config/). A relative path is resolved against this package.
config_file: config/core/corridor_nav.cfg

# --- frames: pose = TF world_frame <- body_frame at the latest time; the setpoint is published in world_frame
world_frame: world
body_frame: body

# --- inputs
map_topic: /treemapper/map                              # treemapper_msgs/TreeMap
set_sprayed_service: /treemapper/set_tree_sprayed       # treemapper_msgs/SetTreeSprayed
disparity_topic: /disparity_image_down_float            # sensor_msgs/Image 32FC1, nadir clearance
left_info_topic: /cam/bottom/left/half/camera_info      # field of view and fx
right_info_topic: /cam/bottom/right/half/camera_info    # baseline = -P[3] / P[0]

# --- camera mount (wide-axis alignment): the drone flies corridor work with the image x-axis (the wide axis) across
# track and sizes corridors with hfov. The yaw of that axis on the body comes from, in this order:
#   ~camera_mount = [x, y, z, qx, qy, qz, qw]  optical camera -> body (treemapper_ros' camera_mount format; set by
#                                              corridor_nav.launch's camera_mount arg, absent here)
#   camera_mount_source: tf                    TF body_frame <- the left camera_info's frame_id, looked up once
#   camera_mount_source: none                  do not look it up
# camera_frame_is_optical (same meaning as in treemapper_ros): true = the mount frame is optical (x right, y down,
# z forward); false = ROS camera frame (x = optical axis), the real drone's sensor_down: the fixed ROS camera ->
# optical rotation is composed first. Isaac: the treemapper_sim.launch camera_mount, optical (true). Real flight:
# camera_frame_is_optical:=false with the mount from TF (corridor_nav.launch camera_mount:=none) or the mount of
# treemapper_real.launch. If none gives a mount (waiting camera_mount_wait s for the TF), the
# yaw is unknown (warned once): corridors are sized with min(hfov, vfov) and flown with yaw = corridor heading.
camera_mount_source: tf
camera_frame_is_optical: true
camera_mount_wait: 5.0                                  # s of ROS time

# --- cadence
rate: 20.0                                              # Hz, control tick (setpoint and spray are published each tick)
