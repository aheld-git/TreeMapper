# cand_obj: REAL-FLIGHT profile (orchard with touching ~7 m crowns at ~8 m spacing, real stereo).
# = config/cand_obj.cfg (sim / default profile) with the 9 keys marked "real profile" changed; chosen by a
# no-ground-truth sweep on the real farm log (results/real_flight_profile.md). Used by
# ros/treemapper_ros/launch/treemapper_real.launch; the sim launch and the evaluation keep cand_obj.cfg.
# The built-in defaults (cand_obj.hpp) equal config/cand_obj.cfg, NOT this file.
# Units: metres, seconds, frames, pixels. Clamp ranges: Config::sanitized() in cand_obj.cpp.
# --- points -> cells
min_range = 0.5
max_range = 30.0
above_drone_margin = 0.5
max_frame_noise = 2.0
height_sample_clearance = 2.0
cell = 0.4
min_cell_points = 2
max_grid = 160
# --- point and frame weighting (M4)
z_ref = 15.0
lateral_k = 10.0
rot_rate_ref = 1.0
quality_recover_s = 1.5
# --- ground plane
ground_low_fraction = 0.4
ground_inlier_band = 0.6
ground_max_slope = 0.3
min_above_ground = 1.0
# --- crowns
# real profile (default 0.6)
min_prominence = 1.0
# real profile (default 4)
min_basin_cells = 8
box_dilate = 0.15
peak_border_px = 24.0
# --- instances
# real profile (default true)
seed_truncated = false
window = 28
hull_cell_corners = false
# real profile (default 2.0)
match_radius = 3.0
match_overlap = 0.5
# real profile (default 3.0)
match_reach = 4.5
# real profile (default 0.25)
seed_overlap = 0.1
max_cell_radius = 4.0
latch_rel_h = 0.0
latch_frames = 5
latch_ratio = 0.75
confirm_frames = 3
min_height_cells = 3
# real profile (default 3.0)
min_publish_area = 8.0
min_tree_height = 1.5
tentative_timeout = 1.5
# --- height model (M4)
cell_weight_cap = 30.0
outlier_gate_m = 2.0
gate_min_weight = 3.0
height_quantile = 0.99
max_height_rate = 0.5
max_centre_rate = 0.8
# --- merges
# real profile (default 0.5)
merge_overlap = 0.3
# real profile (default 1.5)
merge_centre_dist = 2.5
# --- phases
post_spray_hold_radius = 2.0
