# cand_grid configuration (map-centric candidate, M3b). key = value, '#' comments.
# Built-in defaults in core/include/treemapper/candidates/cand_grid/cand_grid.hpp equal this file
# (test CandGridConfig.ShippedConfigFileEqualsBuiltInDefaults). Override in evaluation with
# TM_SET="cand_grid.key=value" or treemapper_replay --config "key=value;...".
# Frozen for the M3 comparison (2026-10-24); tuned on synthetic suite_v1 + the recorded Isaac mission only.

# --- input gates
cell                   = 0.25     # m, grid cell side
min_range              = 0.5      # m, optical depth gate
max_range              = 25.0     # m, beyond this stereo depth is unreliable
above_drone_margin     = 0.3      # points above drone z - margin are impossible (dropped)

# --- evidence weighting
z_ref                  = 15.0     # m, range of unit point weight (weight ~ (z_ref/Z)^4: sigma_Z ~ Z^2)
lateral_k              = 10.0     # weight /= 1 + k*rho^2 (rho = off-axis tangent; lateral error ~ rho*sigma_Z)
frame_cell_cap         = 6        # points of one cell in one frame that count (hover/density invariance)
rot_rate_ref           = 0.35     # rad/s; frame weight *= 1/(1+(rate/ref)^2) (turn blur / noise bursts)
quality_recover_s      = 1.5      # s, frame weight recovers linearly to 1 after a fast rotation
cell_weight_cap        = 30.0     # DSM confidence saturates here (hovering cannot inflate it)
outlier_gate_m         = 2.0      # frame median this far from an established cell height is rejected
gate_min_weight        = 6.0      # ... once the cell has this much weight

# --- ground
coarse                 = 4        # fine cells per coarse ground cell side
ground_quantile        = 0.2      # coarse ground value = this quantile of its known fine cells
ground_radius          = 4.5      # m, first ground guess = min of coarse values within this radius
ground_band            = 0.6      # m, refined ground = mean of cells within this band above the guess
ground_smooth          = 1.5      # m, neighbourhood radius of that mean (0 band = no refinement)
ground_min_frames      = 3        # only cells seen in this many frames define the ground ...
ground_min_weight      = 3.0      # ... with at least this weight (noise at the swath edge drags it down)

# --- extraction / segmentation
extract_period         = 0.2      # s between extractions
window_margin          = 6.0      # m around the recent footprint
min_cell_weight        = 1.0      # cell counts as observed ("known")
canopy_min_h           = 0.5      # m above ground: canopy cell
tree_min_h             = 1.8      # m above ground: a basin peak lower than this is not a tree
merge_saddle           = 0.8      # m, basins whose lower peak rises less than this above the saddle merge
max_tree_radius        = 3.6      # m, segment cells farther from the peak are cut
peak_radius            = 1.0      # m, the peak neighbourhood must be fully observed
max_open_fraction      = 0.6      # segment boundary cells touching unobserved cells, at most

# --- confirmation / publication (confidence model)
latch_weight           = 3.0      # cell weight to latch
latch_rel_h            = 0.6      # a cell latches only if its CHM >= this fraction of its tree's peak CHM
latch_max_spread       = 1.5      # m, cells whose frame medians spread more than this never latch
latch_min_frames       = 3        # distinct frames a cell must have been seen in to latch
latch_confirm          = 2        # consecutive extractions a cell must be assigned to the same tree
box_min_frames         = 2        # frames with detector support for a cell to count as box-supported
box_min_fraction       = 0.3      # fraction of a segment's cells that must be box-supported
confirm_extractions    = 2        # consecutive extractions before an instance is published
min_area               = 5.0      # m^2, smaller instances are not published
height_quantile        = 0.97     # published height = this quantile of the latched cells' surface z
max_height_step        = 0.1      # m per extraction a published height may move (no jumps)
peak_match_dist        = 1.5      # m, unpublished instance <-> segment peak association

# --- persistent-instance merge (rule 4)
merge_confirm          = 3        # consecutive extractions two instances share one basin
frag_max_area_ratio    = 0.6      # the absorbed one must be at most this fraction of the survivor
unconfirmed_timeout    = 3.0      # s, unpublished instances unseen this long are dropped
target_margin          = 1.5      # m, during a descent only cells near the target are updated
climb_release_m        = 1.5      # m, after SPRAYING the descent freeze holds until the drone moved this far
