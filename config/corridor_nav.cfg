# corridor_nav: frozen configuration (key = value, one per line; '#' starts a comment).
# Built-in defaults in nav/corridor_nav/include/corridor_nav/config.hpp equal this file (test NavConfig.ShippedFileEqualsBuiltInDefaults).
# Units: metres, seconds, m/s. Clamp ranges: Config::sanitized() in nav/corridor_nav/src/config.cpp.
# The row heading comes from the field file (heading_rad, else auto), not from here.
# --- strategy: corridor | field_first
strategy = corridor
# --- corridors
z_scan = 15.0
scan_speed = 4.0
corridor_width = 0.0
corridor_width_min = 3.0
corridor_length_min = 5.0
w_margin = 1.0
expected_canopy_top_max = 7.0
expected_canopy_radius_max = 2.5
# a target published above home + expected_canopy_top_max + target_height_margin is skipped (target_height_implausible)
target_height_margin = 2.0
# --- settle / lock
settle_s = 2.0
settle_timeout_s = 8.0
lock_hold_s = 0.5
# --- ordering
order_budget_ms = 5.0
# --- glide
spray_clearance = 2.5
transit_clearance = 2.0
descent_slack = 0.5
drone_radius = 0.8
lateral_margin = 0.5
replan_dz = 0.3
carrot_lead_s = 0.5
max_speed_xy = 4.0
max_speed_z = 1.5
xy_tol = 0.3
z_tol = 0.3
arrive_speed = 0.3
# --- dose: area | fixed
dose_mode = area
dose_s_per_m2 = 0.3
dose_min_s = 2.0
dose_max_s = 6.0
dose_fixed_s = 4.0
dose_valid_frac = 0.8
# --- guard
min_clearance = 1.5
guard_hysteresis = 0.5
guard_window = 0.2
guard_min_valid = 0.3
guard_max_age_s = 0.5
# --- inputs
map_stale_s = 2.0
hold_timeout_s = 20.0
reresolve_radius = 1.5
pose_max_age_s = 0.2
service_retries = 3
